<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

<script>


// ========================================
// GET LOGGED-IN USER
// ========================================

let user = null;


try {

    user =
        JSON.parse(
            localStorage.getItem("user")
        );

} catch (error) {

    console.error(
        "Invalid user data:",
        error
    );

    user = null;

}



// ========================================
// CHECK LOGIN
// ========================================

if (!user) {

    alert("Please login first.");

    window.location.replace(
        "index.html"
    );

}



// ========================================
// GET USER ROLE
// ========================================

const userRole =
    String(user?.role || "")
        .trim()
        .toLowerCase();


console.log(
    "Logged-in user:",
    user
);


console.log(
    "User role:",
    userRole
);



// ========================================
// CHECK ADMIN ACCESS
// ========================================
//
// Allowed:
//
// super_admin
// admin
//
// Not allowed:
//
// student
//

if (
    userRole !== "super_admin" &&
    userRole !== "admin"
) {

    alert(
        "Access denied. Admin only."
    );


    localStorage.removeItem(
        "user"
    );


    window.location.replace(
        "index.html"
    );

}



// ========================================
// LOAD SUBJECTS
// ========================================

async function loadSubjects() {

    try {


        const response =
            await fetch(
                "/api/subjects"
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Failed to load subjects."
            );

        }


        // ========================================
        // GET SUBJECT ARRAY
        // ========================================

        const subjects =
            Array.isArray(data)
                ? data
                : data.subjects || [];


        const table =
            document.getElementById(
                "subjectsTable"
            );


        table.innerHTML = "";



        // ========================================
        // NO SUBJECTS
        // ========================================

        if (subjects.length === 0) {

            table.innerHTML = `

                <tr>

                    <td
                        colspan="5"
                        class="text-center text-muted py-4">

                        No subjects found.

                    </td>

                </tr>

            `;

            return;

        }



        // ========================================
        // DISPLAY SUBJECTS
        // ========================================

        subjects.forEach(
            (subject) => {

                table.innerHTML += `

                    <tr>

                        <td>
                            ${subject.id}
                        </td>

                        <td>
                            ${subject.subject_name}
                        </td>

                        <td>
                            ${subject.subject_code}
                        </td>

                        <td>
                            ${subject.description || "-"}
                        </td>

                        <td>

                            <button
                                class="btn btn-sm btn-danger"
                                onclick="deleteSubject(${subject.id})">

                                Delete

                            </button>

                        </td>

                    </tr>

                `;

            }
        );


    } catch (error) {


        console.error(
            "Error loading subjects:",
            error
        );


        alert(
            "Failed to load subjects."
        );

    }

}



// ========================================
// ADD SUBJECT
// ========================================

document
    .getElementById("subjectForm")
    .addEventListener(
        "submit",
        async function(event) {


            event.preventDefault();



            // ========================================
            // GET FORM VALUES
            // ========================================

            const subjectName =
                document
                    .getElementById(
                        "subjectName"
                    )
                    .value
                    .trim();


            const subjectCode =
                document
                    .getElementById(
                        "subjectCode"
                    )
                    .value
                    .trim()
                    .toUpperCase();


            const description =
                document
                    .getElementById(
                        "description"
                    )
                    .value
                    .trim();



            // ========================================
            // VALIDATION
            // ========================================

            if (
                !subjectName ||
                !subjectCode
            ) {

                alert(
                    "Please enter subject name and subject code."
                );

                return;

            }



            try {


                // ========================================
                // SEND DATA TO SERVER
                // ========================================

                const response =
                    await fetch(
                        "/api/subjects",
                        {

                            method: "POST",


                            headers: {

                                "Content-Type":
                                    "application/json"

                            },


                            body:
                                JSON.stringify({

                                    subjectName:
                                        subjectName,

                                    subjectCode:
                                        subjectCode,

                                    description:
                                        description

                                })

                        }
                    );



                // ========================================
                // GET RESPONSE
                // ========================================

                const data =
                    await response.json();



                // ========================================
                // CHECK ERROR
                // ========================================

                if (!response.ok) {

                    alert(
                        data.message ||
                        "Failed to add subject."
                    );

                    return;

                }



                // ========================================
                // SUCCESS
                // ========================================

                alert(
                    data.message ||
                    "Subject added successfully!"
                );



                // CLEAR FORM

                document
                    .getElementById(
                        "subjectForm"
                    )
                    .reset();



                // ========================================
                // CLOSE MODAL
                // ========================================

                const modalElement =
                    document.getElementById(
                        "addSubjectModal"
                    );


                const modal =
                    bootstrap.Modal.getInstance(
                        modalElement
                    );


                if (modal) {

                    modal.hide();

                }



                // ========================================
                // RELOAD SUBJECTS
                // ========================================

                await loadSubjects();


            } catch (error) {


                console.error(
                    "Add subject error:",
                    error
                );


                alert(
                    "Cannot connect to server."
                );

            }

        }
    );



// ========================================
// DELETE SUBJECT
// ========================================

async function deleteSubject(id) {


    const confirmDelete =
        confirm(
            "Are you sure you want to delete this subject?"
        );


    if (!confirmDelete) {

        return;

    }



    try {


        const response =
            await fetch(
                `/api/subjects/${id}`,
                {

                    method: "DELETE"

                }
            );



        const data =
            await response.json();



        if (!response.ok) {

            alert(
                data.message ||
                "Failed to delete subject."
            );

            return;

        }



        alert(
            data.message ||
            "Subject deleted successfully!"
        );


        await loadSubjects();


    } catch (error) {


        console.error(
            "Delete subject error:",
            error
        );


        alert(
            "Cannot connect to server."
        );

    }

}



// ========================================
// LOGOUT
// ========================================

function logout() {


    localStorage.removeItem(
        "user"
    );


    window.location.replace(
        "index.html"
    );

}



// ========================================
// START PAGE
// ========================================

loadSubjects();


</script>

</body>
