<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Manage Students</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body class="bg-light">


    <!-- =========================================
         NAVBAR
    ========================================== -->

    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <span class="navbar-brand mb-0 h1">
                Student Management System
            </span>

        </div>

    </nav>



    <!-- =========================================
         MAIN CONTENT
    ========================================== -->

    <div class="container py-5">


        <!-- PAGE TITLE -->

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h2 class="fw-bold">
                    Manage Students
                </h2>

                <p class="text-muted mb-0">
                    View, edit and delete registered students.
                </p>

            </div>

        </div>



        <!-- =========================================
             SEARCH
        ========================================== -->

        <div class="card shadow-sm mb-4">

            <div class="card-body">

                <div class="row">

                    <div class="col-md-8">

                        <input
                            type="text"
                            id="searchInput"
                            class="form-control"
                            placeholder="Search by name, email or phone..."
                        >

                    </div>

                    <div class="col-md-4 mt-2 mt-md-0">

                        <button
                            class="btn btn-primary w-100"
                            onclick="loadStudents()">

                            Refresh Students

                        </button>

                    </div>

                </div>

            </div>

        </div>



        <!-- =========================================
             STUDENTS TABLE
        ========================================== -->

        <div class="card shadow-sm">

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-hover align-middle">

                        <thead class="table-dark">

                            <tr>

                                <th>ID</th>

                                <th>Full Name</th>

                                <th>Email</th>

                                <th>Phone</th>

                                <th>Registered</th>

                                <th>Actions</th>

                            </tr>

                        </thead>


                        <tbody id="studentsTable">

                            <tr>

                                <td
                                    colspan="6"
                                    class="text-center text-muted py-4">

                                    Loading students...

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>


    </div>



    <!-- =========================================
         VIEW STUDENT MODAL
    ========================================== -->

    <div
        class="modal fade"
        id="viewStudentModal"
        tabindex="-1">

        <div class="modal-dialog">

            <div class="modal-content">


                <div class="modal-header">

                    <h5 class="modal-title">
                        Student Information
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                    </button>

                </div>


                <div class="modal-body">


                    <div class="mb-3">

                        <strong>Student ID:</strong>

                        <p id="viewId" class="text-muted">
                            -
                        </p>

                    </div>


                    <div class="mb-3">

                        <strong>Full Name:</strong>

                        <p id="viewFullName" class="text-muted">
                            -
                        </p>

                    </div>


                    <div class="mb-3">

                        <strong>Email:</strong>

                        <p id="viewEmail" class="text-muted">
                            -
                        </p>

                    </div>


                    <div class="mb-3">

                        <strong>Phone:</strong>

                        <p id="viewPhone" class="text-muted">
                            -
                        </p>

                    </div>


                    <div class="mb-3">

                        <strong>Registered:</strong>

                        <p id="viewCreatedAt" class="text-muted">
                            -
                        </p>

                    </div>


                </div>


                <div class="modal-footer">

                    <button
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                        Close

                    </button>

                </div>


            </div>

        </div>

    </div>



    <!-- =========================================
         EDIT STUDENT MODAL
    ========================================== -->

    <div
        class="modal fade"
        id="editStudentModal"
        tabindex="-1">

        <div class="modal-dialog">

            <div class="modal-content">


                <div class="modal-header">

                    <h5 class="modal-title">
                        Edit Student
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                    </button>

                </div>


                <div class="modal-body">


                    <input
                        type="hidden"
                        id="editId"
                    >


                    <div class="mb-3">

                        <label class="form-label">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="editFullName"
                            class="form-control"
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            id="editEmail"
                            class="form-control"
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Phone
                        </label>

                        <input
                            type="text"
                            id="editPhone"
                            class="form-control"
                        >

                    </div>


                    <div
                        id="editMessage"
                        class="alert d-none">
                    </div>


                </div>


                <div class="modal-footer">

                    <button
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                        Cancel

                    </button>


                    <button
                        class="btn btn-primary"
                        onclick="updateStudent()">

                        Save Changes

                    </button>

                </div>


            </div>

        </div>

    </div>



    <!-- Bootstrap JavaScript -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>



    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script>


        // ========================================
        // GLOBAL STUDENTS ARRAY
        // ========================================

        let students = [];



        // ========================================
        // LOAD ALL STUDENTS
        // ========================================

        async function loadStudents() {

            const table =
                document.getElementById("studentsTable");


            table.innerHTML = `

                <tr>

                    <td
                        colspan="6"
                        class="text-center py-4">

                        Loading students...

                    </td>

                </tr>

            `;


            try {

                const response =
                    await fetch("/api/admin/students");


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Failed to load students."
                    );

                }


                students =
                    data.students;


                displayStudents(students);


            } catch (error) {

                console.log(
                    "LOAD STUDENTS ERROR:",
                    error
                );


                table.innerHTML = `

                    <tr>

                        <td
                            colspan="6"
                            class="text-center text-danger py-4">

                            Failed to load students.

                        </td>

                    </tr>

                `;

            }

        }



        // ========================================
        // DISPLAY STUDENTS
        // ========================================

        function displayStudents(studentList) {

            const table =
                document.getElementById("studentsTable");


            table.innerHTML = "";


            if (studentList.length === 0) {

                table.innerHTML = `

                    <tr>

                        <td
                            colspan="6"
                            class="text-center text-muted py-4">

                            No students found.

                        </td>

                    </tr>

                `;

                return;

            }


            studentList.forEach(student => {

                const row =
                    document.createElement("tr");


                const date =
                    new Date(
                        student.created_at
                    ).toLocaleDateString();


                row.innerHTML = `

                    <td>
                        ${student.id}
                    </td>

                    <td>
                        ${student.full_name}
                    </td>

                    <td>
                        ${student.email}
                    </td>

                    <td>
                        ${student.phone}
                    </td>

                    <td>
                        ${date}
                    </td>

                    <td>

                        <button
                            class="btn btn-sm btn-info text-white me-1"
                            onclick="viewStudent(${student.id})">

                            View

                        </button>


                        <button
                            class="btn btn-sm btn-warning me-1"
                            onclick="editStudent(${student.id})">

                            Edit

                        </button>


                        <button
                            class="btn btn-sm btn-danger"
                            onclick="deleteStudent(${student.id})">

                            Delete

                        </button>

                    </td>

                `;


                table.appendChild(row);

            });

        }



        // ========================================
        // SEARCH STUDENTS
        // ========================================

        document
            .getElementById("searchInput")
            .addEventListener("input", function () {

                const search =
                    this.value
                        .toLowerCase()
                        .trim();


                const filteredStudents =
                    students.filter(student => {

                        return (

                            student.full_name
                                .toLowerCase()
                                .includes(search)

                            ||

                            student.email
                                .toLowerCase()
                                .includes(search)

                            ||

                            student.phone
                                .toLowerCase()
                                .includes(search)

                        );

                    });


                displayStudents(
                    filteredStudents
                );

            });



        // ========================================
        // VIEW STUDENT
        // ========================================

        async function viewStudent(id) {

            try {

                const response =
                    await fetch(
                        `/api/admin/students/${id}`
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    alert(
                        data.message ||
                        "Failed to load student."
                    );

                    return;

                }


                const student =
                    data.student;


                document.getElementById(
                    "viewId"
                ).textContent =
                    student.id;


                document.getElementById(
                    "viewFullName"
                ).textContent =
                    student.full_name;


                document.getElementById(
                    "viewEmail"
                ).textContent =
                    student.email;


                document.getElementById(
                    "viewPhone"
                ).textContent =
                    student.phone;


                document.getElementById(
                    "viewCreatedAt"
                ).textContent =
                    new Date(
                        student.created_at
                    ).toLocaleString();


                const modal =
                    new bootstrap.Modal(
                        document.getElementById(
                            "viewStudentModal"
                        )
                    );


                modal.show();


            } catch (error) {

                console.log(
                    "VIEW STUDENT ERROR:",
                    error
                );

                alert(
                    "Cannot connect to server."
                );

            }

        }



        // ========================================
        // OPEN EDIT MODAL
        // ========================================

        async function editStudent(id) {

            try {

                const response =
                    await fetch(
                        `/api/admin/students/${id}`
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    alert(
                        data.message ||
                        "Failed to load student."
                    );

                    return;

                }


                const student =
                    data.student;


                document.getElementById(
                    "editId"
                ).value =
                    student.id;


                document.getElementById(
                    "editFullName"
                ).value =
                    student.full_name;


                document.getElementById(
                    "editEmail"
                ).value =
                    student.email;


                document.getElementById(
                    "editPhone"
                ).value =
                    student.phone;


                document.getElementById(
                    "editMessage"
                ).className =
                    "alert d-none";


                const modal =
                    new bootstrap.Modal(
                        document.getElementById(
                            "editStudentModal"
                        )
                    );


                modal.show();


            } catch (error) {

                console.log(
                    "EDIT STUDENT ERROR:",
                    error
                );

                alert(
                    "Cannot connect to server."
                );

            }

        }



        // ========================================
        // UPDATE STUDENT
        // ========================================

        async function updateStudent() {

            const id =
                document.getElementById(
                    "editId"
                ).value;


            const fullName =
                document.getElementById(
                    "editFullName"
                ).value.trim();


            const email =
                document.getElementById(
                    "editEmail"
                ).value.trim();


            const phone =
                document.getElementById(
                    "editPhone"
                ).value.trim();


            const message =
                document.getElementById(
                    "editMessage"
                );


            if (
                !fullName ||
                !email ||
                !phone
            ) {

                message.className =
                    "alert alert-danger";

                message.textContent =
                    "All fields are required.";

                return;

            }


            try {

                const response =
                    await fetch(
                        `/api/admin/students/${id}`,
                        {

                            method: "PUT",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body: JSON.stringify({

                                fullName:
                                    fullName,

                                email:
                                    email,

                                phone:
                                    phone

                            })

                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    message.className =
                        "alert alert-danger";

                    message.textContent =
                        data.message ||
                        "Update failed.";

                    return;

                }


                message.className =
                    "alert alert-success";

                message.textContent =
                    data.message;


                await loadStudents();


                setTimeout(() => {

                    const modal =
                        bootstrap.Modal.getInstance(
                            document.getElementById(
                                "editStudentModal"
                            )
                        );

                    if (modal) {

                        modal.hide();

                    }

                }, 1000);


            } catch (error) {

                console.log(
                    "UPDATE STUDENT ERROR:",
                    error
                );


                message.className =
                    "alert alert-danger";

                message.textContent =
                    "Cannot connect to server.";

            }

        }



        // ========================================
        // DELETE STUDENT
        // ========================================

        async function deleteStudent(id) {

            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this student?"
                );


            if (!confirmDelete) {

                return;

            }


            try {

                const response =
                    await fetch(
                        `/api/admin/students/${id}`,
                        {

                            method: "DELETE"

                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    alert(
                        data.message ||
                        "Delete failed."
                    );

                    return;

                }


                alert(
                    data.message
                );


                loadStudents();


            } catch (error) {

                console.log(
                    "DELETE STUDENT ERROR:",
                    error
                );


                alert(
                    "Cannot connect to server."
                );

            }

        }



        // ========================================
        // LOAD STUDENTS WHEN PAGE OPENS
        // ========================================

        loadStudents();


    </script>


</body>

</html>
