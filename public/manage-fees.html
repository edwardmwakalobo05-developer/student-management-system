<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Fees - Student Management System</title>

    <!-- Bootstrap 5.3.8 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background: #f5f7fb;
        }

        .navbar {
            background: #0f172a;
        }

        .navbar-brand {
            font-weight: 600;
        }

        .page-title {
            font-weight: 700;
            color: #0f172a;
        }

        .card {
            border: none;
            border-radius: 15px;
        }

        .table-card {
            overflow: hidden;
        }

        .table th {
            white-space: nowrap;
        }

        .btn {
            border-radius: 8px;
        }

        .balance {
            font-weight: 600;
        }

        .paid {
            color: green;
            font-weight: 600;
        }

        .unpaid {
            color: red;
            font-weight: 600;
        }

        footer {
            margin-top: 50px;
            padding: 20px;
            text-align: center;
            color: #6c757d;
        }

    </style>

</head>

<body>

<!-- ==========================================
     NAVBAR
========================================== -->

<nav class="navbar navbar-dark">

    <div class="container">

        <a class="navbar-brand" href="admin-dashboard.html">
            Student Management System
        </a>

        <button
            class="btn btn-danger btn-sm"
            onclick="logout()">
            Logout
        </button>

    </div>

</nav>


<!-- ==========================================
     MAIN CONTENT
========================================== -->

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="page-title mb-1">
                Manage Student Fees
            </h2>

            <p class="text-muted mb-0">
                Add, edit and manage student fee records
            </p>

        </div>

        <button
            class="btn btn-primary"
            onclick="openAddModal()">

            + Add Fee

        </button>

    </div>


    <!-- ==========================================
         SEARCH
    ========================================== -->

    <div class="card shadow-sm mb-4">

        <div class="card-body">

            <input
                type="text"
                id="searchInput"
                class="form-control"
                placeholder="Search student, email, fee type or academic year..."
                onkeyup="searchFees()"
            >

        </div>

    </div>


    <!-- ==========================================
         FEES TABLE
    ========================================== -->

    <div class="card shadow-sm table-card">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-dark">

                        <tr>

                            <th>#</th>
                            <th>Student</th>
                            <th>Email</th>
                            <th>Fee Type</th>
                            <th>Total Amount</th>
                            <th>Paid</th>
                            <th>Balance</th>
                            <th>Academic Year</th>
                            <th>Actions</th>

                        </tr>

                    </thead>

                    <tbody id="feesTable">

                        <tr>

                            <td
                                colspan="9"
                                class="text-center text-muted">

                                Loading fees...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<!-- ==========================================
     ADD / EDIT FEE MODAL
========================================== -->

<div
    class="modal fade"
    id="feeModal"
    tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5
                    class="modal-title"
                    id="modalTitle">

                    Add Student Fee

                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>


            <div class="modal-body">

                <form id="feeForm">

                    <input
                        type="hidden"
                        id="feeId"
                    >


                    <!-- STUDENT -->

                    <div class="mb-3">

                        <label
                            class="form-label">
                            Student
                        </label>

                        <select
                            id="studentId"
                            class="form-select"
                            required>

                            <option value="">
                                Select Student
                            </option>

                        </select>

                    </div>


                    <!-- FEE TYPE -->

                    <div class="mb-3">

                        <label
                            class="form-label">
                            Fee Type
                        </label>

                        <input
                            type="text"
                            id="feeType"
                            class="form-control"
                            placeholder="Example: Tuition Fee"
                            required
                        >

                    </div>


                    <!-- TOTAL AMOUNT -->

                    <div class="mb-3">

                        <label
                            class="form-label">
                            Total Amount
                        </label>

                        <input
                            type="number"
                            id="amount"
                            class="form-control"
                            min="0"
                            step="0.01"
                            required
                        >

                    </div>


                    <!-- AMOUNT PAID -->

                    <div class="mb-3">

                        <label
                            class="form-label">
                            Amount Paid
                        </label>

                        <input
                            type="number"
                            id="amountPaid"
                            class="form-control"
                            min="0"
                            step="0.01"
                            value="0"
                            required
                        >

                    </div>


                    <!-- ACADEMIC YEAR -->

                    <div class="mb-3">

                        <label
                            class="form-label">
                            Academic Year
                        </label>

                        <input
                            type="text"
                            id="academicYear"
                            class="form-control"
                            placeholder="Example: 2026/2027"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary w-100">

                        Save Fee

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>


<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>


<script>

/* ==========================================
   CHECK ADMIN LOGIN
========================================== */

const user = JSON.parse(
    localStorage.getItem("user")
);

if (!user) {

    window.location.href = "index.html";

}

const role = String(user.role || "")
    .trim()
    .toLowerCase();

if (role !== "super_admin" && role !== "admin") {

    alert("Access denied. Admin only.");

    window.location.href = "index.html";

}


/* ==========================================
   VARIABLES
========================================== */

let allFees = [];

let feeModal;


/* ==========================================
   PAGE LOAD
========================================== */

document.addEventListener("DOMContentLoaded", async function () {

    feeModal = new bootstrap.Modal(
        document.getElementById("feeModal")
    );

    await loadStudents();

    await loadFees();

});


/* ==========================================
   LOAD STUDENTS
========================================== */

async function loadStudents() {

    try {

        const response = await fetch(
            "/api/admin/students"
        );

        const data = await response.json();

        const students = Array.isArray(data)
            ? data
            : (data.students || []);

        const studentSelect =
            document.getElementById("studentId");

        studentSelect.innerHTML = `
            <option value="">
                Select Student
            </option>
        `;

        students.forEach(student => {

            const option =
                document.createElement("option");

            option.value = student.id;

            option.textContent =
                `${student.full_name} - ${student.email}`;

            studentSelect.appendChild(option);

        });

    } catch (error) {

        console.error(
            "Error loading students:",
            error
        );

        alert(
            "Failed to load students."
        );

    }

}


/* ==========================================
   LOAD FEES
========================================== */

async function loadFees() {

    try {

        const response = await fetch(
            "/api/fees"
        );

        const data = await response.json();

        if (!response.ok) {

            throw new Error(
                data.message || "Failed to load fees"
            );

        }

        allFees = Array.isArray(data)
            ? data
            : (data.fees || []);

        displayFees(allFees);

    } catch (error) {

        console.error(
            "Error loading fees:",
            error
        );

        document.getElementById("feesTable").innerHTML = `

            <tr>

                <td
                    colspan="9"
                    class="text-center text-danger">

                    Failed to load fees.

                </td>

            </tr>

        `;

    }

}


/* ==========================================
   DISPLAY FEES
========================================== */

function displayFees(fees) {

    const table =
        document.getElementById("feesTable");

    table.innerHTML = "";

    if (fees.length === 0) {

        table.innerHTML = `

            <tr>

                <td
                    colspan="9"
                    class="text-center text-muted">

                    No fee records found.

                </td>

            </tr>

        `;

        return;

    }


    fees.forEach((fee, index) => {

        const amount =
            Number(fee.amount) || 0;

        const amountPaid =
            Number(fee.amount_paid) || 0;

        const balance =
            amount - amountPaid;


        const balanceClass =
            balance <= 0
                ? "paid"
                : "unpaid";


        table.innerHTML += `

            <tr>

                <td>
                    ${index + 1}
                </td>

                <td>
                    ${escapeHtml(
                        fee.full_name || ""
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        fee.email || ""
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        fee.fee_type || ""
                    )}
                </td>

                <td>
                    ${formatMoney(amount)}
                </td>

                <td>
                    ${formatMoney(amountPaid)}
                </td>

                <td class="balance ${balanceClass}">
                    ${formatMoney(balance)}
                </td>

                <td>
                    ${escapeHtml(
                        fee.academic_year || ""
                    )}
                </td>

                <td>

                    <button
                        class="btn btn-sm btn-warning me-1"
                        onclick="editFee(${fee.id})">

                        Edit

                    </button>

                    <button
                        class="btn btn-sm btn-danger"
                        onclick="deleteFee(${fee.id})">

                        Delete

                    </button>

                </td>

            </tr>

        `;

    });

}


/* ==========================================
   OPEN ADD MODAL
========================================== */

function openAddModal() {

    document.getElementById(
        "modalTitle"
    ).textContent =
        "Add Student Fee";

    document.getElementById(
        "feeForm"
    ).reset();

    document.getElementById(
        "feeId"
    ).value = "";

    document.getElementById(
        "amountPaid"
    ).value = 0;

    feeModal.show();

}


/* ==========================================
   EDIT FEE
========================================== */

function editFee(id) {

    const fee = allFees.find(
        item => Number(item.id) === Number(id)
    );

    if (!fee) {

        alert("Fee record not found.");

        return;

    }


    document.getElementById(
        "modalTitle"
    ).textContent =
        "Edit Student Fee";


    document.getElementById(
        "feeId"
    ).value = fee.id;


    document.getElementById(
        "studentId"
    ).value = fee.student_id;


    document.getElementById(
        "feeType"
    ).value = fee.fee_type;


    document.getElementById(
        "amount"
    ).value = fee.amount;


    document.getElementById(
        "amountPaid"
    ).value = fee.amount_paid;


    document.getElementById(
        "academicYear"
    ).value = fee.academic_year;


    feeModal.show();

}


/* ==========================================
   SAVE FEE
========================================== */

document.getElementById(
    "feeForm"
).addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();


        const feeId =
            document.getElementById(
                "feeId"
            ).value;


        const studentId =
            Number(
                document.getElementById(
                    "studentId"
                ).value
            );


        const feeType =
            document.getElementById(
                "feeType"
            ).value.trim();


        const amount =
            Number(
                document.getElementById(
                    "amount"
                ).value
            );


        const amountPaid =
            Number(
                document.getElementById(
                    "amountPaid"
                ).value
            );


        const academicYear =
            document.getElementById(
                "academicYear"
            ).value.trim();


        /* VALIDATION */

        if (!studentId) {

            alert(
                "Please select a student."
            );

            return;

        }


        if (!feeType) {

            alert(
                "Please enter fee type."
            );

            return;

        }


        if (
            isNaN(amount) ||
            amount < 0
        ) {

            alert(
                "Please enter a valid total amount."
            );

            return;

        }


        if (
            isNaN(amountPaid) ||
            amountPaid < 0
        ) {

            alert(
                "Please enter a valid paid amount."
            );

            return;

        }


        if (amountPaid > amount) {

            alert(
                "Amount paid cannot be greater than total amount."
            );

            return;

        }


        if (!academicYear) {

            alert(
                "Please enter academic year."
            );

            return;

        }


        const feeData = {

            studentId,
            feeType,
            amount,
            amountPaid,
            academicYear

        };


        try {

            let response;


            /* ADD */

            if (!feeId) {

                response = await fetch(
                    "/api/fees",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify(
                            feeData
                        )

                    }
                );

            }

            /* EDIT */

            else {

                response = await fetch(
                    `/api/fees/${feeId}`,
                    {

                        method: "PUT",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify(
                            feeData
                        )

                    }
                );

            }


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "Failed to save fee"
                );

            }


            alert(
                data.message ||
                "Fee saved successfully!"
            );


            feeModal.hide();

            await loadFees();


        } catch (error) {

            console.error(
                "Save fee error:",
                error
            );

            alert(
                error.message ||
                "Failed to save fee."
            );

        }

    }
);


/* ==========================================
   DELETE FEE
========================================== */

async function deleteFee(id) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this fee record?"
        );


    if (!confirmDelete) {

        return;

    }


    try {

        const response =
            await fetch(
                `/api/fees/${id}`,
                {
                    method: "DELETE"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Failed to delete fee"
            );

        }


        alert(
            data.message ||
            "Fee deleted successfully!"
        );


        await loadFees();


    } catch (error) {

        console.error(
            "Delete fee error:",
            error
        );

        alert(
            error.message ||
            "Failed to delete fee."
        );

    }

}


/* ==========================================
   SEARCH
========================================== */

function searchFees() {

    const search =
        document.getElementById(
            "searchInput"
        ).value
        .toLowerCase()
        .trim();


    const filtered =
        allFees.filter(fee => {

            return (

                String(
                    fee.full_name || ""
                )
                .toLowerCase()
                .includes(search)

                ||

                String(
                    fee.email || ""
                )
                .toLowerCase()
                .includes(search)

                ||

                String(
                    fee.fee_type || ""
                )
                .toLowerCase()
                .includes(search)

                ||

                String(
                    fee.academic_year || ""
                )
                .toLowerCase()
                .includes(search)

            );

        });


    displayFees(filtered);

}


/* ==========================================
   FORMAT MONEY
========================================== */

function formatMoney(amount) {

    return Number(amount).toLocaleString(
        "en-US",
        {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }
    );

}


/* ==========================================
   SECURITY - ESCAPE HTML
========================================== */

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* ==========================================
   LOGOUT
========================================== */

function logout() {

    localStorage.removeItem("user");

    window.location.href =
        "index.html";

}

</script>

</body>
</html>
