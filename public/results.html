<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Results</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body class="bg-light">


<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand"
            href="/student-dashboard.html"
        >
            Student Management System
        </a>

        <button
            class="btn btn-outline-light"
            onclick="logout()"
        >
            Logout
        </button>

    </div>

</nav>



<div class="container py-4">


    <div
        class="d-flex justify-content-between align-items-center mb-4"
    >

        <div>

            <h2>My Results</h2>

            <p class="text-muted mb-0">
                View your academic results
            </p>

        </div>


        <a
            href="/student-dashboard.html"
            class="btn btn-secondary"
        >
            Back to Dashboard
        </a>

    </div>



    <div id="message"></div>



    <div class="card shadow-sm">

        <div class="card-header">

            <h5 class="mb-0">
                Academic Results
            </h5>

        </div>


        <div class="card-body">

            <div class="table-responsive">

                <table
                    class="table table-bordered table-hover"
                >

                    <thead class="table-dark">

                        <tr>

                            <th>#</th>

                            <th>Code</th>

                            <th>Subject</th>

                            <th>Marks</th>

                            <th>Grade</th>

                            <th>Semester</th>

                            <th>Academic Year</th>

                        </tr>

                    </thead>


                    <tbody id="resultsTable">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>



<script>


// ========================================
// GET USER FROM LOCAL STORAGE
// ========================================

const userData = localStorage.getItem("user");


console.log(
    "USER FROM LOCAL STORAGE:",
    userData
);



if (!userData) {

    console.log(
        "NO USER FOUND"
    );

    window.location.href = "/";

} else {

    const user = JSON.parse(userData);


    console.log(
        "LOGGED USER:",
        user
    );


    console.log(
        "USER ID:",
        user.id
    );


    console.log(
        "USER ROLE:",
        user.role
    );



    // ========================================
    // CHECK STUDENT
    // ========================================

    if (user.role !== "student") {

        console.log(
            "USER IS NOT A STUDENT"
        );

        window.location.href = "/";

    } else {

        // ========================================
        // LOAD RESULTS
        // ========================================

        loadResults(user.id);

    }

}



// ========================================
// LOAD RESULTS FUNCTION
// ========================================

async function loadResults(studentId) {


    console.log(
        "Loading results for student ID:",
        studentId
    );


    try {


        const response = await fetch(
            `/api/student/results/${studentId}`
        );


        console.log(
            "SERVER RESPONSE STATUS:",
            response.status
        );


        const data = await response.json();


        console.log(
            "RESULT DATA:",
            data
        );



        const table =
            document.getElementById(
                "resultsTable"
            );



        // ========================================
        // SERVER ERROR
        // ========================================

        if (!data.success) {

            document.getElementById(
                "message"
            ).innerHTML = `

                <div class="alert alert-danger">

                    ${data.message}

                </div>

            `;

            return;

        }



        // ========================================
        // NO RESULTS
        // ========================================

        if (
            !data.results ||
            data.results.length === 0
        ) {

            table.innerHTML = `

                <tr>

                    <td
                        colspan="7"
                        class="text-center text-muted"
                    >

                        No results available yet.

                    </td>

                </tr>

            `;

            return;

        }



        // ========================================
        // DISPLAY RESULTS
        // ========================================

        table.innerHTML = "";


        data.results.forEach(
            (result, index) => {

                table.innerHTML += `

                    <tr>

                        <td>
                            ${index + 1}
                        </td>

                        <td>
                            ${result.subject_code}
                        </td>

                        <td>
                            ${result.subject_name}
                        </td>

                        <td>
                            ${result.marks}
                        </td>

                        <td>
                            <strong>
                                ${result.grade}
                            </strong>
                        </td>

                        <td>
                            ${result.semester}
                        </td>

                        <td>
                            ${result.academic_year}
                        </td>

                    </tr>

                `;

            }
        );


    } catch (error) {


        console.error(
            "RESULTS ERROR:",
            error
        );


        document.getElementById(
            "message"
        ).innerHTML = `

            <div class="alert alert-danger">

                Cannot connect to server.

                <br>

                <small>
                    ${error.message}
                </small>

            </div>

        `;

    }

}



// ========================================
// LOGOUT
// ========================================

function logout() {

    localStorage.removeItem(
        "user"
    );

    window.location.href = "/";

}


</script>


</body>

</html>
