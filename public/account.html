<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/student-dashboard.html">Student Management System</a>
        <button class="btn btn-light btn-sm" onclick="logout()">LOGOUT</button>
    </div>
</nav>

<div class="container py-4">
    <a href="/student-dashboard.html" class="btn btn-outline-primary mb-3">← BACK TO DASHBOARD</a>
    
<div class="card shadow-sm mb-4">
    <div class="card-body">
        <h3>🔐 Account Settings</h3>
        <p class="text-muted">Manage your profile information.</p>

        <div id="message"></div>

        <form id="profileForm">
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" id="fullName" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" id="email" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Phone</label>
                <input type="text" id="phone" class="form-control" required>
            </div>

            <button class="btn btn-dark" type="submit">UPDATE PROFILE</button>
        </form>
    </div>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <h4>Change Password</h4>
        <p class="text-muted">Change your account password.</p>

        <form id="passwordForm">
            <div class="mb-3">
                <label class="form-label">Current Password</label>
                <input type="password" id="currentPassword" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">New Password</label>
                <input type="password" id="newPassword" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Confirm New Password</label>
                <input type="password" id="confirmPassword" class="form-control" required>
            </div>

            <button class="btn btn-primary" type="submit">CHANGE PASSWORD</button>
        </form>
    </div>
</div>

</div>

<script>

const user = JSON.parse(localStorage.getItem("user"));

if (!user || user.role !== "student") {
    window.location.href = "/";
}

async function loadProfile() {
    try {
        const response = await fetch(`/api/student/profile/${user.id}`);
        const result = await response.json();

        if (!result.success) return;

        document.getElementById("fullName").value = result.student.fullName;
        document.getElementById("email").value = result.student.email;
        document.getElementById("phone").value = result.student.phone;
    } catch (error) {
        showMessage("Cannot connect to server.", "danger");
    }
}

function showMessage(message, type = "success") {
    document.getElementById("message").innerHTML =
        `<div class="alert alert-${type}">${message}</div>`;
}

document.getElementById("profileForm").addEventListener("submit", async (event) => {
    event.preventDefault();

    const data = {
        fullName: document.getElementById("fullName").value.trim(),
        email: document.getElementById("email").value.trim(),
        phone: document.getElementById("phone").value.trim()
    };

    try {
        const response = await fetch(`/api/student/profile/${user.id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (!result.success) {
            showMessage(result.message, "danger");
            return;
        }

        user.fullName = data.fullName;
        user.email = data.email;
        user.phone = data.phone;
        localStorage.setItem("user", JSON.stringify(user));

        showMessage("Profile updated successfully!");
    } catch (error) {
        showMessage("Cannot connect to server.", "danger");
    }
});

document.getElementById("passwordForm").addEventListener("submit", async (event) => {
    event.preventDefault();

    const newPassword = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (newPassword !== confirmPassword) {
        showMessage("New passwords do not match.", "danger");
        return;
    }

    try {
        const response = await fetch(`/api/student/password/${user.id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                currentPassword: document.getElementById("currentPassword").value,
                newPassword: newPassword
            })
        });

        const result = await response.json();

        if (!result.success) {
            showMessage(result.message, "danger");
            return;
        }

        document.getElementById("passwordForm").reset();
        showMessage("Password changed successfully!");
    } catch (error) {
        showMessage("Cannot connect to server.", "danger");
    }
});

function logout() {
    localStorage.removeItem("user");
    window.location.href = "/";
}

loadProfile();

</script>
</body>
</html>
