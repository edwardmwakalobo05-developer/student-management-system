<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Manage Documents - Student Management System</title>

    <!-- Bootstrap 5.3.8 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            background-color: #f5f7fb;
        }

        .navbar {
            background-color: #0f172a;
        }

        .page-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .table-card {
            border: none;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .btn-add {
            border-radius: 10px;
        }

        .table th {
            background-color: #0f172a;
            color: white;
            white-space: nowrap;
        }

        .table td {
            vertical-align: middle;
        }

        .document-link {
            text-decoration: none;
        }

        footer {
            margin-top: 50px;
            padding: 20px;
            text-align: center;
            color: #6c757d;
        }

    </style>

</head>


<body>


<!-- ========================================
     NAVBAR
======================================== -->

<nav class="navbar navbar-dark">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="admin-dashboard.html">

            Student Management System

        </a>


        <button
            class="btn btn-outline-light btn-sm"
            onclick="logout()">

            Logout

        </button>

    </div>

</nav>



<!-- ========================================
     MAIN CONTENT
======================================== -->

<div class="container py-5">


    <!-- PAGE HEADER -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="fw-bold mb-1">

                Student Documents

            </h2>

            <p class="text-muted mb-0">

                Manage student documents

            </p>

        </div>


        <button
            class="btn btn-primary btn-add"
            onclick="openAddModal()">

            + Add Document

        </button>

    </div>



    <!-- ========================================
         SEARCH
    ======================================== -->

    <div class="card page-card mb-4">

        <div class="card-body">

            <input
                type="text"
                id="searchInput"
                class="form-control"
                placeholder="Search student, email or document..."
                onkeyup="searchDocuments()">

        </div>

    </div>



    <!-- ========================================
         DOCUMENT TABLE
    ======================================== -->

    <div class="card table-card">

        <div class="table-responsive">

            <table class="table table-hover mb-0">

                <thead>

                    <tr>

                        <th>#</th>

                        <th>Student</th>

                        <th>Email</th>

                        <th>Document</th>

                        <th>Document Link</th>

                        <th>Date</th>

                        <th>Actions</th>

                    </tr>

                </thead>


                <tbody id="documentsTable">

                    <tr>

                        <td
                            colspan="7"
                            class="text-center py-4">

                            Loading documents...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>


</div>



<!-- ========================================
     ADD / EDIT DOCUMENT MODAL
======================================== -->

<div
    class="modal fade"
    id="documentModal"
    tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">


            <div class="modal-header">

                <h5
                    class="modal-title"
                    id="modalTitle">

                    Add Document

                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">

                </button>

            </div>


            <form id="documentForm">

                <div class="modal-body">


                    <!-- Hidden ID -->

                    <input
                        type="hidden"
                        id="documentId">


                    <!-- STUDENT -->

                    <div class="mb-3">

                        <label
                            class="form-label fw-semibold">

                            Student

                        </label>

                        <select
                            id="studentId"
                            class="form-select"
                            required>

                            <option value="">

                                Select Student

                            </option>

                        </select>

                    </div>


                    <!-- DOCUMENT NAME -->

                    <div class="mb-3">

                        <label
                            class="form-label fw-semibold">

                            Document Name

                        </label>

                        <input
                            type="text"
                            id="documentName"
                            class="form-control"
                            placeholder="e.g. Admission Letter"
                            required>

                    </div>


                    <!-- DOCUMENT URL -->

                    <div class="mb-3">

                        <label
                            class="form-label fw-semibold">

                            Document Link

                        </label>

                        <input
                            type="url"
                            id="documentUrl"
                            class="form-control"
                            placeholder="https://example.com/document.pdf"
                            required>

                    </div>


                </div>


                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                        Cancel

                    </button>


                    <button
                        type="submit"
                        class="btn btn-primary">

                        Save Document

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>



<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>



<script>

// ========================================
// CHECK ADMIN LOGIN
// ========================================

const userData =
    localStorage.getItem("user");


if (!userData) {

    window.location.href = "index.html";

}


let user;

try {

    user =
        JSON.parse(userData);

} catch (error) {

    localStorage.removeItem("user");

    window.location.href = "index.html";

}


// ========================================
// CHECK ADMIN ROLE
// ========================================

if (
    user.role !== "super_admin" &&
    user.role !== "admin"
) {

    alert("Access denied. Admin only.");

    window.location.href =
        "student-dashboard.html";

}



// ========================================
// VARIABLES
// ========================================

let documents = [];

let students = [];

let editingDocumentId = null;

let documentModal;



// ========================================
// PAGE LOAD
// ========================================

document.addEventListener(
    "DOMContentLoaded",
    () => {

        documentModal =
            new bootstrap.Modal(
                document.getElementById(
                    "documentModal"
                )
            );


        loadStudents();

        loadDocuments();

    }
);



// ========================================
// LOAD STUDENTS
// ========================================

async function loadStudents() {

    try {

        const response =
            await fetch(
                "/api/admin/students"
            );


        if (!response.ok) {

            throw new Error(
                "Failed to load students."
            );

        }


        const data =
            await response.json();


        students =
            Array.isArray(data)
                ? data
                : data.students || [];


        const select =
            document.getElementById(
                "studentId"
            );


        select.innerHTML = `
            <option value="">
                Select Student
            </option>
        `;


        students.forEach(
            student => {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    student.id;


                option.textContent =
                    `${student.full_name} - ${student.email}`;


                select.appendChild(
                    option
                );

            }
        );

    } catch (error) {

        console.error(
            error
        );

        alert(
            "Failed to load students."
        );

    }

}



// ========================================
// LOAD DOCUMENTS
// ========================================

async function loadDocuments() {

    try {

        const response =
            await fetch(
                "/api/documents"
            );


        if (!response.ok) {

            throw new Error(
                "Failed to load documents."
            );

        }


        const data =
            await response.json();


        documents =
            Array.isArray(data)
                ? data
                : data.documents || [];


        displayDocuments(
            documents
        );

    } catch (error) {

        console.error(
            error
        );


        document.getElementById(
            "documentsTable"
        ).innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="text-center text-danger py-4">

                    Failed to load documents.

                </td>

            </tr>

        `;

    }

}



// ========================================
// DISPLAY DOCUMENTS
// ========================================

function displayDocuments(
    data
) {

    const table =
        document.getElementById(
            "documentsTable"
        );


    if (data.length === 0) {

        table.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="text-center text-muted py-4">

                    No documents found.

                </td>

            </tr>

        `;

        return;

    }


    table.innerHTML =
        data.map(
            (document, index) => {

                const date =
                    document.created_at
                        ? new Date(
                            document.created_at
                        ).toLocaleDateString()
                        : "-";


                const link =
                    document.document_url
                        ? `
                            <a
                                href="${escapeHtml(document.document_url)}"
                                target="_blank"
                                rel="noopener noreferrer"
                                class="btn btn-sm btn-outline-primary document-link">

                                View Document

                            </a>
                          `
                        : `
                            <span class="text-muted">
                                No link
                            </span>
                          `;


                return `

                    <tr>

                        <td>
                            ${index + 1}
                        </td>

                        <td>
                            ${escapeHtml(
                                document.full_name
                            )}
                        </td>

                        <td>
                            ${escapeHtml(
                                document.email
                            )}
                        </td>

                        <td>
                            ${escapeHtml(
                                document.document_name
                            )}
                        </td>

                        <td>
                            ${link}
                        </td>

                        <td>
                            ${date}
                        </td>

                        <td>

                            <button
                                class="btn btn-sm btn-warning me-1"
                                onclick="editDocument(${document.id})">

                                Edit

                            </button>


                            <button
                                class="btn btn-sm btn-danger"
                                onclick="deleteDocument(${document.id})">

                                Delete

                            </button>

                        </td>

                    </tr>

                `;

            }
        ).join("");

}



// ========================================
// OPEN ADD MODAL
// ========================================

function openAddModal() {

    editingDocumentId =
        null;


    document.getElementById(
        "documentForm"
    ).reset();


    document.getElementById(
        "documentId"
    ).value = "";


    document.getElementById(
        "modalTitle"
    ).textContent =
        "Add Document";


    documentModal.show();

}



// ========================================
// EDIT DOCUMENT
// ========================================

function editDocument(
    id
) {

    const document =
        documents.find(
            item =>
                Number(item.id) ===
                Number(id)
        );


    if (!document) {

        alert(
            "Document not found."
        );

        return;

    }


    editingDocumentId =
        id;


    document.getElementById(
        "documentId"
    ).value =
        document.id;


    document.getElementById(
        "studentId"
    ).value =
        document.student_id;


    document.getElementById(
        "documentName"
    ).value =
        document.document_name;


    document.getElementById(
        "documentUrl"
    ).value =
        document.document_url;


    document.getElementById(
        "modalTitle"
    ).textContent =
        "Edit Document";


    documentModal.show();

}



// ========================================
// SAVE DOCUMENT
// ========================================

document.getElementById(
    "documentForm"
).addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const studentId =
            document.getElementById(
                "studentId"
            ).value;


        const documentName =
            document.getElementById(
                "documentName"
            ).value.trim();


        const documentUrl =
            document.getElementById(
                "documentUrl"
            ).value.trim();


        if (
            !studentId ||
            !documentName ||
            !documentUrl
        ) {

            alert(
                "Please fill all fields."
            );

            return;

        }


        const formData = {

            studentId:
                Number(studentId),

            documentName:
                documentName,

            documentUrl:
                documentUrl

        };


        try {

            let response;


            if (
                editingDocumentId
            ) {

                response =
                    await fetch(
                        `/api/documents/${editingDocumentId}`,
                        {
                            method: "PUT",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(
                                    formData
                                )
                        }
                    );

            } else {

                response =
                    await fetch(
                        "/api/documents",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(
                                    formData
                                )
                        }
                    );

            }


            const data =
                await response.json();


            if (!response.ok) {

                alert(
                    data.message ||
                    "Operation failed."
                );

                return;

            }


            alert(
                data.message ||
                "Document saved successfully!"
            );


            documentModal.hide();


            document.getElementById(
                "documentForm"
            ).reset();


            editingDocumentId =
                null;


            loadDocuments();

        } catch (error) {

            console.error(
                error
            );

            alert(
                "Cannot connect to server."
            );

        }

    }
);



// ========================================
// DELETE DOCUMENT
// ========================================

async function deleteDocument(
    id
) {

    const confirmed =
        confirm(
            "Are you sure you want to delete this document?"
        );


    if (!confirmed) {

        return;

    }


    try {

        const response =
            await fetch(
                `/api/documents/${id}`,
                {
                    method: "DELETE"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            alert(
                data.message ||
                "Failed to delete document."
            );

            return;

        }


        alert(
            data.message ||
            "Document deleted successfully!"
        );


        loadDocuments();

    } catch (error) {

        console.error(
            error
        );

        alert(
            "Cannot connect to server."
        );

    }

}



// ========================================
// SEARCH DOCUMENTS
// ========================================

function searchDocuments() {

    const search =
        document.getElementById(
            "searchInput"
        ).value
        .toLowerCase()
        .trim();


    const filtered =
        documents.filter(
            document => {

                return (

                    String(
                        document.full_name || ""
                    )
                    .toLowerCase()
                    .includes(search)

                    ||

                    String(
                        document.email || ""
                    )
                    .toLowerCase()
                    .includes(search)

                    ||

                    String(
                        document.document_name || ""
                    )
                    .toLowerCase()
                    .includes(search)

                );

            }
        );


    displayDocuments(
        filtered
    );

}



// ========================================
// ESCAPE HTML
// ========================================

function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}



// ========================================
// LOGOUT
// ========================================

function logout() {

    localStorage.removeItem(
        "user"
    );

    window.location.href =
        "index.html";

}

</script>



<!-- ========================================
     FOOTER
======================================== -->

<footer>

    Student Management System

</footer>


</body>

</html>
