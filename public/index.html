<body class="bg-light">

```
<!-- ================================
     LOGIN CONTAINER
================================= -->

<div class="container">

    <div
        class="row justify-content-center align-items-center min-vh-100">

        <div class="col-md-5">

            <!-- LOGIN CARD -->

            <div class="card shadow">

                <div class="card-body p-4">

                    <!-- TITLE -->

                    <h2 class="text-center mb-4">

                        Student Management System

                    </h2>


                    <!-- ==========================
                         LOGIN FORM
                    =========================== -->

                    <form id="loginForm">


                        <!-- EMAIL -->

                        <div class="mb-3">

                            <label
                                for="email"
                                class="form-label">

                                Email

                            </label>

                            <input
                                type="email"
                                id="email"
                                class="form-control"
                                placeholder="Enter your email"
                                required>

                        </div>


                        <!-- PASSWORD -->

                        <div class="mb-3">

                            <label
                                for="password"
                                class="form-label">

                                Password

                            </label>

                            <div class="input-group">

                                <input
                                    type="password"
                                    id="password"
                                    class="form-control"
                                    placeholder="Enter your password"
                                    required>

                                <button
                                    type="button"
                                    id="showPassword"
                                    class="btn btn-outline-secondary">

                                    👁

                                </button>

                            </div>

                        </div>


                        <!-- LOGIN BUTTON -->

                        <button
                            type="submit"
                            id="loginButton"
                            class="btn btn-primary w-100">

                            LOGIN

                        </button>

                    </form>


                    <!-- MESSAGE -->

                    <div
                        id="message"
                        class="mt-3">

                    </div>


                    <!-- ==========================
                         REGISTER
                    =========================== -->

                    <div
                        class="text-center mt-4">

                        <p class="mb-2">

                            Don't have an account?

                        </p>

                        <a
                            href="/register.html"
                            class="btn btn-success w-100">

                            REGISTER

                        </a>

                    </div>


                </div>

            </div>

        </div>

    </div>

</div>


<!-- ================================
     JAVASCRIPT
================================= -->

<script>


    // =================================
    // GET ELEMENTS
    // =================================

    const loginForm =
        document.getElementById("loginForm");

    const email =
        document.getElementById("email");

    const password =
        document.getElementById("password");

    const showPassword =
        document.getElementById("showPassword");

    const loginButton =
        document.getElementById("loginButton");

    const message =
        document.getElementById("message");


    // =================================
    // SHOW / HIDE PASSWORD
    // =================================

    showPassword.addEventListener(
        "click",
        () => {

            if (password.type === "password") {

                password.type = "text";

                showPassword.textContent = "🙈";

            } else {

                password.type = "password";

                showPassword.textContent = "👁";

            }

        }
    );


    // =================================
    // LOGIN FORM
    // =================================

    loginForm.addEventListener(
        "submit",
        async (event) => {

            event.preventDefault();


            // Disable button

            loginButton.disabled = true;

            loginButton.textContent = "LOGGING IN...";


            // Clear message

            message.innerHTML = "";


            try {


                // =================================
                // SEND LOGIN DATA TO SERVER
                // =================================

                const response =
                    await fetch(
                        "/api/login",
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    email:
                                        email.value.trim(),

                                    password:
                                        password.value

                                })

                        }
                    );


                // =================================
                // GET SERVER RESPONSE
                // =================================

                const result =
                    await response.json();


                // =================================
                // LOGIN SUCCESS
                // =================================

                if (result.success) {


                    // ---------------------------------
                    // GET USER FROM SERVER
                    // ---------------------------------

                    const user =
                        result.user;


                    // ---------------------------------
                    // CHECK THAT USER EXISTS
                    // ---------------------------------

                    if (!user) {

                        throw new Error(
                            "User information was not returned by server."
                        );

                    }


                    // ---------------------------------
                    // SAVE COMPLETE USER INFORMATION
                    // INCLUDING ROLE
                    // ---------------------------------

                    localStorage.setItem(
                        "user",
                        JSON.stringify({

                            id: user.id,

                            fullName:
                                user.fullName,

                            email:
                                user.email,

                            phone:
                                user.phone,

                            role:
                                user.role

                        })
                    );


                    // ---------------------------------
                    // SUCCESS MESSAGE
                    // ---------------------------------

                    message.innerHTML = `

                        <div class="alert alert-success">

                            ${result.message}

                        </div>

                    `;


                    // ---------------------------------
                    // NORMALIZE ROLE
                    // ---------------------------------

                    const role =
                        String(user.role || "")
                            .trim()
                            .toLowerCase();


                    console.log(
                        "Logged in user:",
                        user
                    );

                    console.log(
                        "User role:",
                        role
                    );


                    // =================================
                    // REDIRECT
                    // =================================

                    setTimeout(() => {


                        // STUDENT

                        if (role === "student") {

                            window.location.href =
                                "/student-dashboard.html";

                        }


                        // SUPER ADMIN

                        else if (
                            role === "super_admin"
                        ) {

                            window.location.href =
                                "/admin-dashboard.html";

                        }


                        // ADMIN
                        // Also allowed in case your
                        // database has admin role.

                        else if (
                            role === "admin"
                        ) {

                            window.location.href =
                                "/admin-dashboard.html";

                        }


                        // UNKNOWN ROLE

                        else {

                            alert(
                                "Login successful, but your account role is not recognized: " +
                                user.role
                            );

                            loginButton.disabled =
                                false;

                            loginButton.textContent =
                                "LOGIN";

                        }


                    }, 700);


                }


                // =================================
                // LOGIN FAILED
                // =================================

                else {


                    message.innerHTML = `

                        <div class="alert alert-danger">

                            ${result.message}

                        </div>

                    `;


                    loginButton.disabled = false;

                    loginButton.textContent = "LOGIN";

                }


            }


            // =================================
            // CONNECTION ERROR
            // =================================

            catch (error) {


                console.error(
                    "LOGIN ERROR:",
                    error
                );


                message.innerHTML = `

                    <div class="alert alert-danger">

                        Cannot connect to server.

                    </div>

                `;


                loginButton.disabled = false;

                loginButton.textContent = "LOGIN";

            }

        }
    );


</script>
```

</body>

</html>
