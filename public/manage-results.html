<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Manage Results</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body class="bg-light">


<!-- ==================================================
     NAVBAR
================================================== -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            href="admin-dashboard.html"
            class="navbar-brand fw-bold">

            Student Management System

        </a>


        <button
            class="btn btn-outline-light btn-sm"
            onclick="logout()">

            Logout

        </button>

    </div>

</nav>



<!-- ==================================================
     MAIN CONTENT
================================================== -->

<div class="container py-4">


    <!-- PAGE TITLE -->

    <div class="d-flex
                justify-content-between
                align-items-center
                mb-4">

        <div>

            <h2 class="fw-bold">
                Manage Results
            </h2>

            <p class="text-muted mb-0">
                Add and view student results
            </p>

        </div>


        <a
            href="admin-dashboard.html"
            class="btn btn-secondary">

            ← Dashboard

        </a>

    </div>



    <!-- ==================================================
         ADD RESULT CARD
    ================================================== -->

    <div class="card shadow-sm mb-4">

        <div class="card-header bg-primary text-white">

            <h5 class="mb-0">
                Add Student Result
            </h5>

        </div>


        <div class="card-body">

            <form id="resultForm">


                <div class="row g-3">


                    <!-- STUDENT -->

                    <div class="col-md-6">

                        <label
                            class="form-label fw-semibold">

                            Student

                        </label>


                        <select
                            id="studentId"
                            class="form-select"
                            required>

                            <option value="">
                                Select Student
                            </option>

                        </select>

                    </div>



                    <!-- SUBJECT -->

                    <div class="col-md-6">

                        <label
                            class="form-label fw-semibold">

                            Subject

                        </label>


                        <select
                            id="subjectId"
                            class="form-select"
                            required>

                            <option value="">
                                Select Subject
                            </option>

                        </select>

                    </div>



                    <!-- MARKS -->

                    <div class="col-md-3">

                        <label
                            class="form-label fw-semibold">

                            Marks

                        </label>


                        <input
                            type="number"
                            id="marks"
                            class="form-control"
                            min="0"
                            max="100"
                            step="0.01"
                            placeholder="0 - 100"
                            required>

                    </div>



                    <!-- SEMESTER -->

                    <div class="col-md-3">

                        <label
                            class="form-label fw-semibold">

                            Semester

                        </label>


                        <select
                            id="semester"
                            class="form-select"
                            required>

                            <option value="">
                                Select Semester
                            </option>

                            <option value="Semester 1">
                                Semester 1
                            </option>

                            <option value="Semester 2">
                                Semester 2
                            </option>

                        </select>

                    </div>



                    <!-- ACADEMIC YEAR -->

                    <div class="col-md-3">

                        <label
                            class="form-label fw-semibold">

                            Academic Year

                        </label>


                        <input
                            type="text"
                            id="academicYear"
                            class="form-control"
                            placeholder="2026/2027"
                            required>

                    </div>



                    <!-- BUTTON -->

                    <div class="col-md-3 d-flex align-items-end">

                        <button
                            type="submit"
                            class="btn btn-primary w-100">

                            Add Result

                        </button>

                    </div>

                </div>

            </form>

        </div>

    </div>



    <!-- ==================================================
         RESULTS TABLE
    ================================================== -->

    <div class="card shadow-sm">

        <div class="card-header">

            <h5 class="mb-0">
                All Student Results
            </h5>

        </div>


        <div class="card-body">


            <!-- SEARCH -->

            <div class="mb-3">

                <input
                    type="text"
                    id="searchInput"
                    class="form-control"
                    placeholder="Search student, email or subject...">

            </div>



            <div class="table-responsive">

                <table
                    class="table table-bordered table-hover align-middle">

                    <thead class="table-dark">

                        <tr>

                            <th>#</th>

                            <th>Student</th>

                            <th>Email</th>

                            <th>Subject</th>

                            <th>Marks</th>

                            <th>Grade</th>

                            <th>Semester</th>

                            <th>Academic Year</th>

                        </tr>

                    </thead>


                    <tbody id="resultsTable">

                        <tr>

                            <td
                                colspan="8"
                                class="text-center text-muted">

                                Loading results...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>


</div>



<!-- ==================================================
     JAVASCRIPT
================================================== -->

<script>


// ==================================================
// CHECK LOGIN
// ==================================================

let user = null;


try {

    user =
        JSON.parse(
            localStorage.getItem("user")
        );

} catch (error) {

    user = null;

}


if (!user) {

    alert("Please login first.");

    window.location.replace("index.html");

}


const userRole =
    String(user?.role || "")
        .trim()
        .toLowerCase();


if (
    userRole !== "super_admin" &&
    userRole !== "admin"
) {

    alert("Access denied. Admin only.");

    localStorage.removeItem("user");

    window.location.replace("index.html");

}



// ==================================================
// VARIABLES
// ==================================================

let allResults = [];



// ==================================================
// LOAD STUDENTS
// ==================================================

async function loadStudents() {

    try {

        const response =
            await fetch("/api/admin/students");

        const data =
            await response.json();


        if (!response.ok || !data.success) {

            throw new Error(
                data.message ||
                "Failed to load students."
            );

        }


        const students =
            Array.isArray(data)
                ? data
                : data.students || [];


        const studentSelect =
            document.getElementById(
                "studentId"
            );


        studentSelect.innerHTML =
            `<option value="">
                Select Student
            </option>`;


        students.forEach(student => {

            const option =
                document.createElement("option");


            option.value =
                student.id;


            option.textContent =
                `${student.full_name} - ${student.email}`;


            studentSelect.appendChild(
                option
            );

        });

    } catch (error) {

        console.error(error);

        alert(
            "Failed to load students: " +
            error.message
        );

    }

}



// ==================================================
// LOAD SUBJECTS
// ==================================================

async function loadSubjects() {

    try {

        const response =
            await fetch("/api/subjects");

        const data =
            await response.json();


        if (!response.ok || !data.success) {

            throw new Error(
                data.message ||
                "Failed to load subjects."
            );

        }


        const subjects =
            Array.isArray(data)
                ? data
                : data.subjects || [];


        const subjectSelect =
            document.getElementById(
                "subjectId"
            );


        subjectSelect.innerHTML =
            `<option value="">
                Select Subject
            </option>`;


        subjects.forEach(subject => {

            const option =
                document.createElement("option");


            option.value =
                subject.id;


            option.textContent =
                `${subject.subject_code} - ${subject.subject_name}`;


            subjectSelect.appendChild(
                option
            );

        });

    } catch (error) {

        console.error(error);

        alert(
            "Failed to load subjects: " +
            error.message
        );

    }

}



// ==================================================
// LOAD RESULTS
// ==================================================

async function loadResults() {

    try {

        const response =
            await fetch("/api/results");

        const data =
            await response.json();


        if (!response.ok || !data.success) {

            throw new Error(
                data.message ||
                "Failed to load results."
            );

        }


        allResults =
            Array.isArray(data.results)
                ? data.results
                : [];


        displayResults(
            allResults
        );

    } catch (error) {

        console.error(error);


        document.getElementById(
            "resultsTable"
        ).innerHTML = `

            <tr>

                <td
                    colspan="8"
                    class="text-center text-danger">

                    Failed to load results.

                </td>

            </tr>

        `;

    }

}



// ==================================================
// DISPLAY RESULTS
// ==================================================

function displayResults(results) {

    const table =
        document.getElementById(
            "resultsTable"
        );


    table.innerHTML = "";


    if (results.length === 0) {

        table.innerHTML = `

            <tr>

                <td
                    colspan="8"
                    class="text-center text-muted">

                    No results found.

                </td>

            </tr>

        `;

        return;

    }


    results.forEach((result, index) => {

        const row =
            document.createElement("tr");


        row.innerHTML = `

            <td>
                ${index + 1}
            </td>

            <td>
                ${escapeHtml(
                    result.full_name
                )}
            </td>

            <td>
                ${escapeHtml(
                    result.email
                )}
            </td>

            <td>
                ${escapeHtml(
                    result.subject_code
                )}
                -
                ${escapeHtml(
                    result.subject_name
                )}
            </td>

            <td>
                ${result.marks}
            </td>

            <td>

                <span class="badge bg-primary">

                    ${escapeHtml(
                        result.grade
                    )}

                </span>

            </td>

            <td>
                ${escapeHtml(
                    result.semester
                )}
            </td>

            <td>
                ${escapeHtml(
                    result.academic_year
                )}
            </td>

        `;


        table.appendChild(row);

    });

}



// ==================================================
// ADD RESULT
// ==================================================

document.getElementById(
    "resultForm"
).addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const studentId =
            document.getElementById(
                "studentId"
            ).value;


        const subjectId =
            document.getElementById(
                "subjectId"
            ).value;


        const marks =
            document.getElementById(
                "marks"
            ).value;


        const semester =
            document.getElementById(
                "semester"
            ).value;


        const academicYear =
            document.getElementById(
                "academicYear"
            ).value.trim();


        if (
            !studentId ||
            !subjectId ||
            marks === "" ||
            !semester ||
            !academicYear
        ) {

            alert(
                "Please fill all result information."
            );

            return;

        }


        const numericMarks =
            Number(marks);


        if (
            numericMarks < 0 ||
            numericMarks > 100
        ) {

            alert(
                "Marks must be between 0 and 100."
            );

            return;

        }


        try {

            const response =
                await fetch(
                    "/api/results",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body: JSON.stringify({

                            studentId:
                                Number(studentId),

                            subjectId:
                                Number(subjectId),

                            marks:
                                numericMarks,

                            semester:
                                semester,

                            academicYear:
                                academicYear

                        })

                    }
                );


            const data =
                await response.json();


            if (!response.ok || !data.success) {

                throw new Error(
                    data.message ||
                    "Failed to add result."
                );

            }


            alert(
                data.message ||
                "Result added successfully!"
            );


            document.getElementById(
                "resultForm"
            ).reset();


            await loadResults();

        } catch (error) {

            console.error(error);

            alert(
                error.message
            );

        }

    }
);



// ==================================================
// SEARCH RESULTS
// ==================================================

document.getElementById(
    "searchInput"
).addEventListener(
    "input",
    function() {

        const search =
            this.value
                .toLowerCase()
                .trim();


        if (!search) {

            displayResults(
                allResults
            );

            return;

        }


        const filtered =
            allResults.filter(result => {

                return (

                    String(
                        result.full_name || ""
                    )
                    .toLowerCase()
                    .includes(search)

                    ||

                    String(
                        result.email || ""
                    )
                    .toLowerCase()
                    .includes(search)

                    ||

                    String(
                        result.subject_name || ""
                    )
                    .toLowerCase()
                    .includes(search)

                    ||

                    String(
                        result.subject_code || ""
                    )
                    .toLowerCase()
                    .includes(search)

                    ||

                    String(
                        result.grade || ""
                    )
                    .toLowerCase()
                    .includes(search)

                );

            });


        displayResults(
            filtered
        );

    }
);



// ==================================================
// ESCAPE HTML
// ==================================================

function escapeHtml(value) {

    const div =
        document.createElement("div");


    div.textContent =
        value ?? "";


    return div.innerHTML;

}



// ==================================================
// LOGOUT
// ==================================================

function logout() {

    localStorage.removeItem(
        "user"
    );


    window.location.replace(
        "index.html"
    );

}



// ==================================================
// START
// ==================================================

loadStudents();

loadSubjects();

loadResults();


</script>


</body>

</html>
```
