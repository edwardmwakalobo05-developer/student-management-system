<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>


    <!-- Bootstrap 5.3.8 -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body class="bg-light">


<div class="container">

    <div class="row justify-content-center align-items-center min-vh-100">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h2 class="text-center mb-4">
                        Student Registration
                    </h2>


                    <form id="registerForm">


                        <!-- =================================
                             FULL NAME
                        ================================== -->

                        <div class="mb-3">

                            <label
                                for="fullName"
                                class="form-label">

                                Full Name

                            </label>

                            <input
                                type="text"
                                id="fullName"
                                class="form-control"
                                placeholder="Enter your full name"
                                required>

                        </div>



                        <!-- =================================
                             EMAIL
                        ================================== -->

                        <div class="mb-3">

                            <label
                                for="email"
                                class="form-label">

                                Email

                            </label>

                            <input
                                type="email"
                                id="email"
                                class="form-control"
                                placeholder="example@gmail.com"
                                pattern="[a-zA-Z0-9._%+-]+@gmail\.com"
                                title="Please enter a valid Gmail address, for example example@gmail.com"
                                required>

                        </div>



                        <!-- =================================
                             PHONE
                        ================================== -->

                        <div class="mb-3">

                            <label
                                for="phone"
                                class="form-label">

                                Phone Number

                            </label>

                            <input
                                type="tel"
                                id="phone"
                                class="form-control"
                                placeholder="Enter phone number"
                                required>

                        </div>



                        <!-- =================================
                             PASSWORD
                             NO EYE BUTTON HERE
                        ================================== -->

                        <div class="mb-3">

                            <label
                                for="password"
                                class="form-label">

                                Password

                            </label>

                            <input
                                type="password"
                                id="password"
                                class="form-control"
                                placeholder="Create password"
                                required>

                        </div>



                        <!-- =================================
                             CONFIRM PASSWORD
                             EYE BUTTON ONLY HERE
                        ================================== -->

                        <div class="mb-3">

                            <label
                                for="confirmPassword"
                                class="form-label">

                                Confirm Password

                            </label>


                            <div class="input-group">

                                <input
                                    type="password"
                                    id="confirmPassword"
                                    class="form-control"
                                    placeholder="Confirm password"
                                    required>


                                <button
                                    type="button"
                                    id="showConfirmPassword"
                                    class="btn btn-outline-secondary">

                                    👁

                                </button>

                            </div>

                        </div>



                        <!-- =================================
                             REGISTER BUTTON
                        ================================== -->

                        <button
                            type="submit"
                            id="registerButton"
                            class="btn btn-success w-100">

                            REGISTER

                        </button>


                    </form>



                    <!-- =================================
                         MESSAGE
                    ================================== -->

                    <div
                        id="message"
                        class="mt-3">

                    </div>


                </div>

            </div>

        </div>

    </div>

</div>



<script>


// ========================================
// GET ELEMENTS
// ========================================

const form =
    document.getElementById("registerForm");


const email =
    document.getElementById("email");


const password =
    document.getElementById("password");


const confirmPassword =
    document.getElementById("confirmPassword");


const registerButton =
    document.getElementById("registerButton");


const message =
    document.getElementById("message");



// ========================================
// SHOW / HIDE CONFIRM PASSWORD
// ========================================
//
// ONLY CONFIRM PASSWORD HAS EYE BUTTON
//

document
    .getElementById("showConfirmPassword")
    .addEventListener("click", () => {


        if (
            confirmPassword.type === "password"
        ) {

            confirmPassword.type = "text";

            document
                .getElementById("showConfirmPassword")
                .textContent = "🙈";

        } else {

            confirmPassword.type = "password";

            document
                .getElementById("showConfirmPassword")
                .textContent = "👁";

        }

    });



// ========================================
// REGISTER
// ========================================

form.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();



        // =================================
        // CHECK GMAIL FORMAT
        // =================================

        const gmailPattern =
            /^[a-zA-Z0-9._%+-]+@gmail\.com$/;


        if (
            !gmailPattern.test(
                email.value.trim()
            )
        ) {

            message.innerHTML = `

                <div class="alert alert-danger">

                    Please use a valid Gmail address,
                    for example:
                    <strong>example@gmail.com</strong>

                </div>

            `;

            email.focus();

            return;

        }



        // =================================
        // CHECK PASSWORDS
        // =================================

        if (
            password.value !==
            confirmPassword.value
        ) {

            message.innerHTML = `

                <div class="alert alert-danger">

                    Passwords do not match.

                </div>

            `;

            confirmPassword.focus();

            return;

        }



        // =================================
        // PREPARE DATA
        // =================================

        const data = {

            fullName:
                document
                    .getElementById("fullName")
                    .value
                    .trim(),

            email:
                email.value
                    .trim()
                    .toLowerCase(),

            phone:
                document
                    .getElementById("phone")
                    .value
                    .trim(),

            password:
                password.value

        };



        // =================================
        // DISABLE REGISTER BUTTON
        // =================================

        registerButton.disabled = true;

        registerButton.textContent =
            "REGISTERING...";


        message.innerHTML = "";



        // =================================
        // SEND DATA TO SERVER
        // =================================

        try {

            const response =
                await fetch(
                    "/api/register",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify(data)

                    }
                );



            // =================================
            // SERVER RESPONSE
            // =================================

            const result =
                await response.json();



            // =================================
            // REGISTRATION SUCCESS
            // =================================

            if (result.success) {

                message.innerHTML = `

                    <div class="alert alert-success">

                        ${result.message}

                    </div>

                `;


                form.reset();


                registerButton.disabled =
                    false;

                registerButton.textContent =
                    "REGISTER";

            }



            // =================================
            // REGISTRATION FAILED
            // =================================

            else {

                message.innerHTML = `

                    <div class="alert alert-danger">

                        ${result.message}

                    </div>

                `;


                registerButton.disabled =
                    false;

                registerButton.textContent =
                    "REGISTER";

            }


        } catch (error) {

            console.error(
                "REGISTRATION ERROR:",
                error
            );


            message.innerHTML = `

                <div class="alert alert-danger">

                    Cannot connect to server.

                </div>

            `;


            registerButton.disabled =
                false;

            registerButton.textContent =
                "REGISTER";

        }

    }
);

</script>


</body>

</html>
