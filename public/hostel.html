<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hostel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/student-dashboard.html">Student Management System</a>
        <button class="btn btn-light btn-sm" onclick="logout()">LOGOUT</button>
    </div>
</nav>

<div class="container py-4">
    <a href="/student-dashboard.html" class="btn btn-outline-primary mb-3">← BACK TO DASHBOARD</a>
    
<div class="card shadow-sm">
    <div class="card-body">
        <h3>🏠 Hostel Information</h3>
        <p class="text-muted">View your current hostel allocation.</p>
        <div id="message"></div>
        <div id="hostelContainer">
            <div class="text-muted">Loading hostel information...</div>
        </div>
    </div>
</div>

</div>

<script>

const user = JSON.parse(localStorage.getItem("user"));

if (!user || user.role !== "student") {
    window.location.href = "/";
}

async function loadHostel() {
    try {
        const response = await fetch(`/api/student/hostel/${user.id}`);
        const result = await response.json();

        if (!result.success) {
            document.getElementById("message").innerHTML =
                `<div class="alert alert-danger">${result.message}</div>`;
            return;
        }

        if (!result.hostel) {
            document.getElementById("hostelContainer").innerHTML =
                `<div class="alert alert-info">No hostel allocation available yet.</div>`;
            return;
        }

        const h = result.hostel;

        document.getElementById("hostelContainer").innerHTML = `
            <div class="row g-3">
                <div class="col-md-6">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <p><strong>Hostel:</strong> ${h.hostel_name}</p>
                            <p><strong>Block:</strong> ${h.block_name}</p>
                            <p><strong>Room:</strong> ${h.room_number}</p>
                            <p><strong>Bed:</strong> ${h.bed_number}</p>
                            <p><strong>Status:</strong> <span class="badge bg-success">${h.status}</span></p>
                        </div>
                    </div>
                </div>
            </div>
        `;
    } catch (error) {
        document.getElementById("message").innerHTML =
            `<div class="alert alert-danger">Cannot connect to server.</div>`;
    }
}

function logout() {
    localStorage.removeItem("user");
    window.location.href = "/";
}

loadHostel();

</script>
</body>
</html>
